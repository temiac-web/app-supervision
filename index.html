<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#040c1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<title>CRG Supervisión</title>
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--bg:#040c1f;--blue:#2496f5;--orange:#f58714;--green:#00e6a5;--txt:#eef3fa}
html,body{height:100%;margin:0;color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
html{background:var(--bg) linear-gradient(160deg,#081c44 0%,#040c1f 52%,#02071a 100%) no-repeat}
body{background:transparent}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ---------- Fondo: cuadrícula de gráfica que se desplaza + luces de color ---------- */
.grid,.lights{position:fixed;inset:0;pointer-events:none;opacity:0;animation:fade 1.6s ease-out .1s forwards}
.grid{background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);
  background-size:44px 44px;animation:fade 1.6s ease-out .1s forwards,drift 8s linear infinite;
  -webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 0,transparent 68%);mask-image:radial-gradient(ellipse at 50% 42%,#000 0,transparent 68%)}
.lights{background:
  radial-gradient(circle at 18% 82%,#2496f53a,transparent 46%),
  radial-gradient(circle at 85% 18%,#00e6a533,transparent 44%),
  radial-gradient(circle at 12% 15%,#f5871429,transparent 40%)}
@keyframes drift{to{background-position:-44px 0,-44px 0}}
@keyframes fade{to{opacity:1}}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px;text-align:center;width:100%;box-sizing:border-box;
  padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}

/* ---------- Ícono ---------- */
.mark{position:relative;width:min(70vw,280px);aspect-ratio:1;margin:-40px 0 -34px;
  animation:pulse 1s ease-out 2.2s}
.mark img,.mark svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.bar1{clip-path:inset(100% 0 0 0);animation:grow .7s cubic-bezier(.2,.9,.3,1) .35s forwards}
.bar2{clip-path:inset(100% 0 0 0);animation:grow .8s cubic-bezier(.2,.9,.3,1) .5s forwards}
.brain{opacity:0;filter:blur(8px);transform:scale(.94);transform-origin:70% 60%;animation:focus 1s ease-out .85s forwards}
@keyframes grow{to{clip-path:inset(0 0 0 0)}}
@keyframes focus{to{opacity:1;filter:none;transform:none}}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 0 #00e6a500) drop-shadow(0 0 0 #2496f500)}
  40%{filter:drop-shadow(0 0 12px #00e6a599) drop-shadow(0 0 26px #2496f566)}}

/* ---------- Nombres de las marcas ---------- */
.names{display:flex;justify-content:center;gap:clamp(16px,6vw,30px)}
.n{opacity:0;transform:translateY(8px);padding-top:9px;position:relative;white-space:nowrap;
  font-weight:600;font-size:clamp(12px,3.7vw,15px);letter-spacing:.14em;color:var(--c);
  animation:up .6s ease-out var(--d) forwards}
.n:before{content:"";position:absolute;top:0;left:0;height:2px;border-radius:2px;background:var(--c);
  width:100%;transform:scaleX(0);transform-origin:left;animation:line .6s ease-out calc(var(--d) + .1s) forwards}
.n1{--c:var(--orange);--d:2.4s}
.n2{--c:var(--green);--d:2.55s}
.n3{--c:var(--blue);--d:2.7s}
@keyframes up{to{opacity:1;transform:none}}
@keyframes line{to{transform:scaleX(1)}}

/* ---------- Nombre: cada letra sube desde una línea invisible ---------- */
.ready{margin:0;font-weight:400;font-size:clamp(13px,3.6vw,15px);letter-spacing:.03em;opacity:0;color:#eef3fab3;animation:hello .8s cubic-bezier(.2,.8,.2,1) 3.9s forwards}
@keyframes hello{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hello{margin:0;overflow:hidden;white-space:nowrap;padding:.1em .04em .2em;font-weight:400;font-size:clamp(20px,6.1vw,32px);letter-spacing:.08em;line-height:1.15;color:#eef3facc}
.hello .b{font-weight:700;color:var(--txt)}
.ch{display:inline-block;transform:translateY(120%);opacity:0;
  animation:letter .8s cubic-bezier(.2,.9,.2,1) calc(3s + var(--i)*.05s) forwards}
@keyframes letter{to{transform:none;opacity:1}}

.bar{width:140px;height:2px;border-radius:2px;background:#ffffff1f;overflow:hidden;opacity:0;animation:fade .3s 4.3s forwards}
.bar i{display:block;height:100%;background:var(--blue);transform:scaleX(0);transform-origin:left;animation:load 1.1s ease-in-out 4.4s forwards}
@keyframes load{to{transform:scaleX(1)}}

.stage.out{animation:out .4s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
